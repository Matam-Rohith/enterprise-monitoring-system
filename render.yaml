services:
  - type: web
    name: enterprise-monitoring-system
    runtime: node
    region: singapore
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/system/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        fromDatabase: {name: enterprise-monitoring-db, property: host}
      - key: DB_PORT
        fromDatabase: {name: enterprise-monitoring-db, property: port}
      - key: DB_NAME
        fromDatabase: {name: enterprise-monitoring-db, property: database}
      - key: DB_USER
        fromDatabase: {name: enterprise-monitoring-db, property: user}
      - key: DB_PASSWORD
        fromDatabase: {name: enterprise-monitoring-db, property: password}
      - key: DB_SSL
        value: "true"
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: enterprise-monitoring-db
    databaseName: enterprise_monitoring
    user: enterprise_monitoring
    plan: free
